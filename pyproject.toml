[project]
name = "hasdata-zillow-mcp"
version = "1.0.0"
description = "MCP server for Zillow through HasData's hosted API. No Zillow account."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "zillow", "real-estate", "property", "model-context-protocol", "hasdata"]
# mcp is pinned below 2 because mcp-proxy 0.12.0 imports request_ctx, removed in the mcp 2.x SDK.
dependencies = ["mcp-proxy>=0.12.0", "mcp>=1.17,<2"]

[project.urls]
Homepage = "https://hasdata.com/apis/zillow-api"
Repository = "https://github.com/HasData/zillow-mcp"

[project.scripts]
hasdata-zillow-mcp = "hasdata_zillow_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hasdata_zillow_mcp"]
